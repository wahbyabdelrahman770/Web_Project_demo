<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up | Recipe Finder</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-default="guest">
    <header class="site-header">
        <div class="container header-row">
            <a class="brand" href="index.html">Recipe<span>Finder</span></a>
            <nav class="nav" aria-label="Main navigation">
                <a href="index.html">Home</a> <!--data-roles="guest user admin"-->
                <a href="browse.html">Browse recipes</a> <!--data-roles="guest user admin"-->
                <a href="favorites.html">My Favorites</a> <!--data-roles="user"-->
                <a href="admin.html">Manage recipes</a> <!--data-roles="admin"-->
                <a href="recipe-form.html">Add recipe</a> <!--data-roles="admin"-->
                <a href="login.html">Log in</a> <!--data-roles="guest"-->
                <a href="signup.html" aria-current="page">Sign up</a> <!--data-roles="guest"-->
                <a href="index.html" data-logout>Log out</a> <!--data-roles="user admin"-->
            </nav>
            <div class="role-switch"><label for="role-select" style="margin:0;font-weight:400">Preview as</label>
                <select id="role-select">
                    <option value="guest">Guest</option>
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
        </div>
    </header>
    <main class="container">
        <form class="card-form" data-auth action="#" novalidate>
            <h1>Create your account</h1>
            <p class="muted">Fields marked <span class="req">*</span> are required.</p>
            <div class="field"><label for="name">Full name <span class="req">*</span></label><input id="name"
                    name="fullname" type="text" autocomplete="name" placeholder="Your full name" required></div>
            <div class="field"><label for="email">Email <span class="req">*</span></label><input id="email" name="email"
                    type="email" autocomplete="email" placeholder="you@example.com" required></div>
            <div class="field"><label for="pw">Password <span class="req">*</span></label><input id="pw" name="password"
                    type="password" minlength="8" autocomplete="new-password" placeholder="At least 8 characters"
                    required></div>
            <div class="field"><label for="pw2">Confirm password <span class="req">*</span></label><input id="pw2"
                    name="confirm" type="password" autocomplete="new-password" placeholder="Repeat your password"
                    required></div>
            <div class="field"><label for="acc">Account type <span class="req">*</span></label><select id="acc"
                    name="account" required>
                    <option value="user">User &ndash; browse and save recipes</option>
                    <option value="admin">Administrator &ndash; manage recipes</option>
                </select></div>
            <div class="field"><label class="check"><input type="checkbox" name="terms" required> I agree to the terms
                    of use <span class="req">*</span></label></div>
            <button class="btn" type="submit" style="width:100%">Sign up</button>
            <p class="form-foot">Already have an account? <a href="login.html">Log in</a></p>
        </form>
    </main>
    <footer class="site-footer">
        <div class="container" style="text-align: center;">Recipe Finder &middot; IS231 Web Technology</div>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
